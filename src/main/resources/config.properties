# Defaults genericos y seguros para empaquetar en el jar. NO poner aca nada especifico de un
# entorno (URL del backend, ruta del driver PKCS#11, etc.) -- eso va en un config.properties
# externo (junto al ejecutable o en el directorio de trabajo), que ahora sí tiene prioridad
# real sobre este archivo (ver Config.java).
xnet.connect.timeout.ms=8000
xnet.read.timeout.ms=30000
xnet.preview.dpi=110

# Sellado de tiempo RFC 3161 (ancla la firma a un reloj externo confiable). Si el TSA no
# responde, se firma igual sin sello: nunca bloquea la firma. tsa.enabled=false lo apaga.
tsa.enabled=true
tsa.url=http://timestamp.digicert.com
tsa.connect.timeout.ms=3000
tsa.read.timeout.ms=5000
