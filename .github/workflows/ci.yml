name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn test
        run: mvn -B test

  package-smoke-test:
    # Empaqueta con jpackage (mismo camino que build_msi_gui.bat) para detectar en cada push
    # errores como modulos faltantes en --add-modules (ej. java.net.http), que solo aparecen
    # al ejecutar la app ya empaquetada y no durante `mvn test`. No genera el MSI real (eso
    # necesita WiX y admin); alcanza con --type app-image, que ya pasa por el mismo jlink.
    needs: unit-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar jar (sin tests, ya corrieron en el job anterior)
        run: mvn -B -DskipTests package

      - name: Descargar JavaFX jmods
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/21.0.9/openjfx-21.0.9_windows-x64_bin-jmods.zip" -OutFile jmods.zip
          Expand-Archive -Path jmods.zip -DestinationPath .

      # jpackage mete TODO lo que encuentre en --input dentro de la app. Con --input target se
      # empaquetaban tambien target\classes, maven-status, generated-sources, archive-tmp y una
      # copia extra del jar sin dependencias. Se arma una carpeta con solo el fat jar (limpiandola
      # antes, para que un runner reutilizado no arrastre un jar de una version anterior).
      - name: Preparar carpeta de entrada limpia para jpackage
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $ver = $pom.project.version
          $stage = "target\jpackage-input"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target\feamass-$ver-jar-with-dependencies.jar" -Destination $stage
          Get-ChildItem $stage | ForEach-Object { Write-Host "staged: $($_.Name)" }

      # OJO --add-opens=java.base/sun.security.util: no hay codigo que use ese paquete interno
      # (CertLoader usa solo la API publica: Security.getProvider("SunMSCAPI") + KeyStore
      # "Windows-MY"), asi que se ve eliminable, pero no se quita a ciegas: si algo de la cadena
      # SunMSCAPI lo necesitara en runtime, la app empaquetada fallaria al listar certificados y
      # ningun test lo detectaria (no tocan Windows-MY ni hardware). Verificar con un MSI real y
      # un certificado/token de verdad antes de sacarlo, aqui y en build_msi_gui.bat.
      - name: jpackage (smoke test de empaquetado)
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $ver = $pom.project.version
          Write-Host "Version: $ver"

          & jpackage `
            --type app-image `
            --name "FEA Mass Signer" `
            --app-version $ver `
            --input "target\jpackage-input" `
            --main-jar "feamass-$ver-jar-with-dependencies.jar" `
            --main-class com.dictuc.feamass.MainFx `
            --icon assets\icon.ico `
            --module-path "javafx-jmods-21.0.9" `
            --add-modules java.desktop,java.net.http,javafx.base,javafx.graphics,javafx.controls,javafx.fxml,javafx.swing,jdk.crypto.mscapi `
            --java-options "--add-opens=java.base/sun.security.util=ALL-UNNAMED" `
            --java-options "-Dsun.security.mscapi.keyStoreCompatibilityMode=true" `
            --dest dist_ci

          if ($LASTEXITCODE -ne 0) {
            Write-Error "jpackage fallo (exit $LASTEXITCODE)"
            exit 1
          }
          if (-not (Test-Path "dist_ci\FEA Mass Signer\FEA Mass Signer.exe")) {
            Write-Error "jpackage no genero el ejecutable esperado"
            exit 1
          }
          Write-Host "OK: app-image generada correctamente."
